name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # No BASE_PATH: Cloudflare Pages serves from the root of its own subdomain, so the
      # bundle stays root-relative. (vite.config.ts still honours BASE_PATH for anyone
      # self-hosting under a subpath -- see docs/PLAN.md.)
      - name: Build
        run: pnpm build

      # Deploying from this job rather than a separate one means the bytes published are
      # exactly the bytes just built and tested -- no artifact round-trip, no rebuild.
      # Steps are sequential, so a failed test never reaches this.
      - name: Deploy to Cloudflare Pages
        if: github.ref_name == github.event.repository.default_branch
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=timeslife --branch=${{ github.ref_name }}
